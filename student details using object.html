<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Object</title>
</head>

<body>

<script>

    
    let student1 = new Object();

    student1.name = "mukul";
    student1.id = "3212";
    student1.city = "Ghaziabad";

    student1.learning = function() {
        console.log("Learning tech");
        console.log(student1.name);
    };

    student1.learning();


    
    let student = {
        name: "Mukul",
        id: "3432",
        city: "Ghaziabad",

        learning: function() {
            console.log("Tech subject");
        }
    };

   
    student.pincode = 23443;

  
    student.gym = function() {
        student.subject = ["Web", "DSA"];
    };

    student.learning();
    student.gym();

    console.log(student);
    console.log(student.subject);

</script>

</body>
</html>
